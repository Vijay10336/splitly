spring.application.name=splitly
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/splitly}
spring.datasource.username=${DATABASE_USER:splitly}
spring.datasource.password=${DATABASE_PASSWORD:splitly-local}
spring.sql.init.mode=always
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.public-url=${PUBLIC_URL:http://localhost:18090}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:18090,capacitor://localhost,https://localhost}
app.mail-from=${MAIL_FROM:hello@splitly.local}
app.google-client-id=${GOOGLE_CLIENT_ID:}
app.google-client-secret=${GOOGLE_CLIENT_SECRET:}
server.error.include-message=never
server.forward-headers-strategy=none
server.tomcat.max-http-form-post-size=64KB
spring.servlet.multipart.max-request-size=1MB
